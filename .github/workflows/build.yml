name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.installer }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: deb
            script: ./scripts/package.sh deb
          - os: macos-latest
            installer: dmg
            script: ./scripts/package.sh dmg
          - os: windows-latest
            installer: msi
            script: pwsh -File scripts/package.ps1 -Type msi
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: mvn -B verify

      - name: Package installer
        run: ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.installer }}
          path: target/jpackage/*
          if-no-files-found: error
